#-----------------------------------
# Lemon Basic Environment Variables.
# - for `lemon` Profile
#
# @date 2019.03.04
#-----------------------------------
# default
default_env: &default_env
  LS: 0                   # log silence.
  LC: 1                   # line-coloring
  TS: 1                   # time-stamp in line
  NAME: 'lemon'
  BACKBONE_API: ''        # use VPC + NAT @191219.
  USE_SESSION: 1          # use session (default yes w/ session-token)
  REPORT_ERROR: 1         # for lemon-core#2. report error in lambda-handler.

  # ES6_VERSION: '7.10'
  # ES6_INDEX: 'lemon-templates-v1'
  # ES6_ENDPOINT: 'https://vpc-eureka-es72-isal7yrmwmw3ifhftfyia2qcxy.aos.ap-northeast-2.on.aws'

  # NOTE - use os2 search endpoint. w/o using search-proxy.
  OS2_ENDPOINT: 'https://search-eureka-os2-uxoajmyfedwmpd3zzue7cwdfrm.ap-northeast-2.es.amazonaws.com'
  OS2_INDEX: 'lemon-templates-v1-25035776'
  # `aws kms encrypt --profile lemon --region ap-northeast-2 --key-id alias/lemon-hello-api --plaintext fileb://<(printf '%s' 'signature text') --query CiphertextBlob --output text`
  # use `aws kms decrypt --profile lemon --ciphertext-blob fileb://<(echo "ciphertext blob" | base64 --decode) --output text --query Plaintext | base64 --decode`
  OS2_SIGNATURE: '*'
  OS2_PAYLOAD: 'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.'

#-----------------------------------
# test for jest in local
test:
  <<: *default_env
  # ES6_ENDPOINT: https://ag1qbtayhj.execute-api.ap-northeast-2.amazonaws.com/dev/search/0/proxy

#-----------------------------------
# local development configuration.
local:
  <<: *default_env
  REPORT_ERROR_ARN: arn:aws:sns:ap-northeast-2:085403634746:lemon-hello-sns

  # WARN - for development.
  STAGE: '!develop'
  NS: TT
  MY_DYNAMO_TABLE:  lemon-templates-table-dev
  USE_SESSION: sample/context-session.json             # Load sample for session use in local env
  # ES6_ENDPOINT: https://ag1qbtayhj.execute-api.ap-northeast-2.amazonaws.com/dev/search/0/proxy    # use search-proxy after deployment.

  #WARN - for prod debugging.
  # STAGE: '!production'
  # NS: SS
  # MY_DYNAMO_TABLE:  lemon-templates-table
  # USE_SESSION: sample/context-session.json

#-----------------------------------
# development server
dev:
  <<: *default_env
  STAGE: 'develop'

#-----------------------------------
# production with AWS deploy
prod:
  <<: *default_env
  STAGE: 'production'
  NS: SS
  TS: 0
